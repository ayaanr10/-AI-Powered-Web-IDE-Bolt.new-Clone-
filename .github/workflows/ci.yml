name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: NODE_ENV=production npm install --include=dev --no-audit --no-fund
      - run: npm run check
      - name: Smoke test production web service
        run: |
          NODE_ENV=production PUBLIC_DEMO=1 PORT=37891 node server/index.js > /tmp/buildora-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:37891/api/health > /tmp/buildora-health.json; then break; fi
            sleep 1
          done
          grep -q '"ok":true' /tmp/buildora-health.json
          grep -q '"liveAvailable":false' /tmp/buildora-health.json
          curl -fsS -D /tmp/buildora-headers http://127.0.0.1:37891/ -o /tmp/buildora-home.html
          grep -q 'Buildora' /tmp/buildora-home.html
          grep -qi '^cross-origin-opener-policy: same-origin' /tmp/buildora-headers
          grep -qi '^cross-origin-embedder-policy: credentialless' /tmp/buildora-headers
