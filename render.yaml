services:
  - type: web
    name: buildora-ide-demo
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      # Keep public AI generation off until authentication and spending limits exist.
      - key: PUBLIC_ZAP_ENABLED
        value: "0"
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
