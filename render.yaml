services:
  - type: web
    name: buildora-ide-demo
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      # Set these in the Render Environment page before public generation is enabled:
      # GEMINI_API_KEY, GEMINI_MODEL, TURNSTILE_SITE_KEY, and TURNSTILE_SECRET_KEY.
      # Secret values must never be committed to this Blueprint or frontend bundle.
