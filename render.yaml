services:
  - type: web
    name: buildora-ide-demo
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      # Private Zap demo is enabled only if the server ALSO has:
      # GEMINI_API_KEY and ZAP_ACCESS_CODE (at least 16 characters).
      # Without both private credentials, the backend stays locked.
      - key: PUBLIC_ZAP_ENABLED
        value: "1"
      # GEMINI_MODEL, GEMINI_API_KEY and ZAP_ACCESS_CODE are set
      # privately on the existing service's Render Environment page.
      # Do not commit secret values to this Blueprint.
